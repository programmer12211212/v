 .ov{align-items:center}
 .sh{margin:0 auto;width:calc(100% - 48px);max-width:520px;max-height:88%;transform:translateY(20px)}
 .toast{left:calc(50% + 120px)}
 #pg-reels.on{left:calc(50% + 120px);width:min(100%,420px)}
 .sv{box-shadow:0 0 0 100vmax rgba(0,0,0,.88)}
 .cbar{left:240px;bottom:24px;padding:0 24px}
 .cbar .cin{max-width:496px}
 .row,.chip,.tile,.pri,.send{cursor:pointer}
 .row:hover{background:rgba(255,255,255,.05)}
}
@media (min-width:1366px){
 .sd{display:block;position:fixed;top:40px;left:calc(50% + 120px + 260px + 24px);width:260px;z-index:4}
 .sd .sdme,.sd .sdr{display:flex;align-items:center;gap:12px;font-size:13px}
 .sd .sdme{margin-bottom:22px;cursor:pointer}.sd .sdme .av{width:46px;height:46px}
 .sd b{display:block;font-size:13px}.sd .sdh{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:14px}
 .sd .sdr{margin-bottom:14px}.sd .sdr .av{width:36px;height:36px}.sd .sdr .t{flex:1;min-width:0}.sd .sdr .t span{display:block;font-size:12px;color:var(--mut)}
 .sd .fl{font-size:12px;font-weight:700;color:#5b8def;padding:6px 8px;display:block}.sd .fl.on{color:var(--mut)}
}
/* settings / plans / badges */
:root{--gl:24px}
.bg::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,0);pointer-events:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pill,.bar{background:rgba(32,32,38,.9)}}
.sh .post{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;background:rgba(255,255,255,.05)}
button:disabled{opacity:.55;cursor:default}
.lt{font-size:12px;color:var(--mut);font-weight:600}
.me-h>.gear{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%}
.me-h>div:last-child{padding-right:34px;min-width:0}
.mb{display:inline-flex;align-items:center;vertical-align:middle;margin-left:2px}
.row .t .mb{display:inline-flex;color:inherit;overflow:visible}
.bi{width:16px;height:16px;fill:var(--c);stroke:none;flex:none}
.nm .bi{width:20px;height:20px}
.bi.vip{filter:drop-shadow(0 0 4px var(--c))}
.bi .k{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tb{display:inline-block;font:800 10px/1 Inter,sans-serif;letter-spacing:.4px;padding:3px 6px;border-radius:8px;background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);vertical-align:middle}
.bgd{display:flex;flex-wrap:wrap;gap:10px}
.bt{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.bt .bi{width:26px;height:26px}
.bt.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
label input[type=range]{background:none;border:0;padding:0;height:24px;accent-color:#fff}
.pc{padding:16px;display:flex;flex-direction:column;gap:12px}
.pc.cur{border-color:rgba(255,255,255,.45)}
.ph{display:flex;align-items:center;gap:8px}.ph>b{font-size:17px}
.ph .pr{margin-left:auto;text-align:right;font-weight:800;font-size:15px}
.pr small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.fl2{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.fl2 li{display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.fl2 svg{width:16px;height:16px;stroke:#5ddf9b;stroke-width:2.6;margin-top:1px;flex:none}
#ebgp[hidden]{display:none}

const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});

async function media(f){
 let blob=f,name='video.mp4';
 if(f.type.startsWith('video/')){if(f.size>100e6)throw"Video 100 MB dan oshmasin";name=f.name||name}
 else if(f.type.startsWith('image/')){const im=new Image();im.src=await rd(f);await im.decode();const rt=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*rt));c.height=Math.max(1,Math.round(im.height*rt));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85));if(!blob)throw"Rasmni qayta ishlab bo'lmadi";name='image.jpg'}
 else throw"Bu fayl turi qo'llanmaydi";
 const fd=new FormData();fd.append('file',blob,name);const r=await api('/api/media/',fd);return{k:r.kind=='video'?'v':'i',src:r.url}}
const fileIn=(acc,multi,cb)=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.multiple=!!multi;i.onchange=()=>cb([...i.files]);i.click()};
